# Reproducible local integration of the official PyPSA-Eur electricity tutorial
# with pathway-pilot's direct GAMS-bundled CPLEX adapter.
tutorial: true

run:
  name: "cplex-tutorial"
  disable_progressbar: true
  shared_resources:
    policy: false
  use_shadow_directory: false

scenario:
  clusters: [5]
  opts: ['']

countries: ['BE']

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

electricity:
  co2limit_enable: true
  co2limit: 100.e+6
  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

atlite:
  default_cutout: be-03-2013-era5
  cutouts:
    be-03-2013-era5:
      module: era5
      x: [4., 15.]
      y: [46., 56.]
      time: ["2013-03-01", "2013-03-08"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  exclude_carriers: [OCGT, offwind-ac, coal]
  temporal:
    resolution_elec: 24h

lines:
  dynamic_line_rating:
    activate: true
    max_line_rating: 1.3

solving:
  options:
    skip_iterations: true
    transmission_losses: false
    linearized_unit_commitment: false
  solver:
    name: gams-cplex-direct
    options: cplex-direct
  solver_options:
    cplex-direct:
      threads: 6
      method: barrier
      gams_dir: C:/GAMS/37
      work_dir: __PYPSA_EUR_DATA_ROOT__/solver-work
  check_objective:
    enable: false
